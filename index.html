<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kusra Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0d0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 55px 22px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .studio {
      color: #8d8d96;
      letter-spacing: 8px;
      font-size: 13px;
      margin-bottom: 50px;
    }

    .title {
      font-size: 18px;
      margin-bottom: 25px;
      color: #c9c9cf;
    }

    .game {
      background: #18181c;
      border: 1px solid #29292f;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
      transition: 0.2s;
    }

    .game:hover {
      transform: translateY(-3px);
      border-color: #555;
    }

    .game h2 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .game p {
      margin: 0 0 20px;
      color: #9999a3;
      font-size: 14px;
    }

    .play-button {
      display: block;
      text-decoration: none;
      background: white;
      color: black;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
    }

    footer {
      margin-top: 45px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">KUSRA</div>
    <div class="studio">STUDIO</div>

    <div class="title">Independent Games</div>

    <div class="game">
      <h2>Kio's Wild Run</h2>
      <p>Fast-paced endless runner.</p>

      <a class="play-button"
         href="https://play.google.com/store/apps/details?id=com.Kioswildrun">
        Get it on Google Play
      </a>
    </div>

    <div class="game">
      <h2>Perfect Drop</h2>
      <p>Simple. Addictive. One more try.</p>

      <a class="play-button"
         href="https://play.google.com/store/apps/details?id=com.kusrastudio.perfectdrop">
        Get it on Google Play
      </a>
    </div>

    <footer>
      © 2026 Kusra Studio
    </footer>

  </main>

</body>
</html>
